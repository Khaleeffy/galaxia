<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galaxia — Sauvetage v2</title>
<style>
body{font-family:monospace;background:#0a0612;color:#d8b8ff;padding:14px;margin:0;line-height:1.5;font-size:14px;}
h1{color:#fff;font-size:17px;border-bottom:1px solid #6644aa;padding-bottom:6px;margin-top:0;}
h2{color:#aa88ee;font-size:14px;margin-top:18px;border-bottom:1px solid #4a3070;padding-bottom:4px;}
button{background:linear-gradient(135deg,#5034a0,#3a2480);color:#fff;border:1px solid #aa66ff;padding:11px 14px;font-size:13px;border-radius:7px;cursor:pointer;font-family:monospace;font-weight:bold;width:100%;margin:6px 0;}
button.green{background:linear-gradient(135deg,#3a8050,#205030);border-color:#66cc88;}
button.orange{background:linear-gradient(135deg,#a06030,#603018);border-color:#ee9955;}
button.red{background:linear-gradient(135deg,#803040,#502020);border-color:#cc6666;}
.box{background:rgba(40,25,70,0.5);border:1px solid #6644aa;border-radius:6px;padding:10px;margin:10px 0;font-size:12px;}
.warn{background:rgba(80,40,40,0.5);border-color:#cc6666;color:#ffaabb;}
.ok{background:rgba(40,80,50,0.5);border-color:#66cc88;color:#b8ffcc;}
.info{background:rgba(40,50,80,0.5);border-color:#6688cc;color:#aaccff;}
pre{background:#1a0e2a;color:#bbaadd;border:1px solid #4a3070;border-radius:4px;padding:8px;font-size:11px;overflow:auto;max-height:200px;white-space:pre-wrap;word-break:break-word;}
</style>
</head>
<body>
<h1>🛟 GALAXIA — Sauvetage v2</h1>
<div id="status"></div>

<h2>📊 Diagnostic</h2>
<button onclick="runDiagnostic()">🔍 ANALYSER MA SAVE</button>
<div id="diag"></div>

<h2>🔧 Réparations (ordre du moins agressif au plus)</h2>
<button class="green" onclick="fixGentle()">1️⃣ DOUCE — Nettoyage léger</button>
<button onclick="fixAnomalies()">2️⃣ DÉSACTIVER ANOMALIES — Vide anomalies/notifs/boosts</button>
<button class="orange" onclick="fixHard()">3️⃣ AGRESSIVE — Vide aussi flottes et queue</button>
<button class="orange" onclick="resetTick()">4️⃣ RESET TICK — Remet l'horloge à zéro</button>

<h2>📤 Sauvegarde</h2>
<button onclick="downloadSave()">💾 TÉLÉCHARGER MA SAVE (.json)</button>
<button onclick="showStateOnly()">👁️ AFFICHER MON STATE PRINCIPAL</button>

<h2>⚠️ Dernier recours</h2>
<button class="red" onclick="resetAll()">🗑️ TOUT EFFACER</button>

<div id="output"></div>

<script>
function getKeys(){var a=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf("gx_")===0)a.push(k);}return a;}
function getStateKey(){var keys=getKeys();for(var i=0;i<keys.length;i++)if(keys[i].indexOf("gx_state_")===0)return keys[i];return null;}
function setStatus(msg,kind){document.getElementById("status").innerHTML='<div class="box '+(kind||"info")+'">'+msg+'</div>';}
function setDiag(html){document.getElementById("diag").innerHTML=html;}
function setOutput(html){document.getElementById("output").innerHTML=html;}

function runDiagnostic(){
  setDiag("");
  setOutput("");
  var sk=getStateKey();
  if(!sk){setStatus("❌ Aucun state trouvé","warn");return;}
  try{
    var s=JSON.parse(localStorage.getItem(sk));
    var report=[];
    var issues=[];
    report.push("📦 Clé state : "+sk);
    report.push("💰 Ressources : métal="+(s.resources&&s.resources.metal)+", cristal="+(s.resources&&s.resources.crystal)+", deut="+(s.resources&&s.resources.deut));
    report.push("🏗️ Bâtiments : "+(s.buildings?Object.keys(s.buildings).length+" types":"absents"));
    report.push("🚀 Vaisseaux : "+(s.ships?JSON.stringify(s.ships):"absents"));
    report.push("✈️ Flottes actives : "+(s.fleets?s.fleets.length:0));
    if(s.fleets&&s.fleets.length>0){
      for(var i=0;i<s.fleets.length;i++){
        var f=s.fleets[i];
        var t="  Flotte #"+(i+1)+": ";
        if(!f||typeof f!=="object"){t+="❌ INVALIDE";issues.push("flotte "+(i+1)+" non-objet");}
        else{
          t+="kind="+(f.kind||"normal")+", id="+(f.id||"?");
          if(f.kind==="anomaly")t+=", anomalyId="+f.anomalyId;
          if(typeof f.arriveAt!=="number"){t+=" ⚠️ arriveAt invalide";issues.push("flotte "+(i+1)+" arriveAt invalide");}
          if(typeof f.departAt!=="number"){t+=" ⚠️ departAt invalide";issues.push("flotte "+(i+1)+" departAt invalide");}
        }
        report.push(t);
      }
    }
    report.push("🌌 Anomalies : "+(s.anomalies?s.anomalies.length:0));
    if(s.anomalies&&s.anomalies.length>0){
      for(var j=0;j<s.anomalies.length;j++){
        var a=s.anomalies[j];
        if(!a||!a.pos||typeof a.pos.x!=="number"){issues.push("anomalie "+(j+1)+" position invalide");}
      }
    }
    report.push("🔔 anomalyNotifs : "+(s.anomalyNotifs?s.anomalyNotifs.length:0));
    report.push("⚡ activeBoosts : "+(s.activeBoosts?s.activeBoosts.length:0));
    report.push("🔬 pendingTechCredits : "+(s.pendingTechCredits||0));
    report.push("🏗️ Queue construction : "+(s.queue?JSON.stringify(s.queue):"vide"));
    if(s.queue&&typeof s.queue.finishAt!=="number")issues.push("queue.finishAt invalide");
    report.push("🎯 Missions actives : "+(s.activeMission||"aucune"));
    report.push("⏰ lastTick : "+(s.lastTick?new Date(s.lastTick).toLocaleString():"absent"));
    if(s.lastTick){
      var hoursSince=(Date.now()-s.lastTick)/3600000;
      report.push("   → "+hoursSince.toFixed(1)+"h depuis dernier tick");
      if(hoursSince>72)issues.push("dernier tick il y a +72h (gros calcul rattrapage)");
    }
    var html='<div class="box info"><pre>'+report.join("\n")+'</pre></div>';
    if(issues.length>0){
      html+='<div class="box warn"><b>⚠️ '+issues.length+' problème(s) détecté(s) :</b><br>'+issues.map(function(x){return "• "+x;}).join("<br>")+'</div>';
    } else {
      html+='<div class="box ok">✅ Aucun problème évident détecté. Le crash vient peut-être d\'ailleurs.</div>';
    }
    setDiag(html);
  }catch(e){setStatus("❌ Erreur diagnostic : "+e.message,"warn");}
}

function fixGentle(){
  if(!confirm("Réparation douce : nettoyage léger des données invalides. OK ?"))return;
  var sk=getStateKey();
  if(!sk){setStatus("Pas de state","warn");return;}
  try{
    var s=JSON.parse(localStorage.getItem(sk));
    if(s.queue&&(typeof s.queue!=="object"||typeof s.queue.finishAt!=="number"))s.queue=null;
    if(!s.ships||typeof s.ships!=="object")s.ships={};
    if(!s.resources)s.resources={metal:0,crystal:0,deut:0};
    s.lastTick=Date.now();
    localStorage.setItem(sk,JSON.stringify(s));
    setStatus("✅ Réparation douce appliquée","ok");
  }catch(e){setStatus("Erreur : "+e.message,"warn");}
}

function fixAnomalies(){
  if(!confirm("Désactive complètement les anomalies, notifs et boosts. Tu garderas tout le reste. OK ?"))return;
  var sk=getStateKey();
  if(!sk){setStatus("Pas de state","warn");return;}
  try{
    var s=JSON.parse(localStorage.getItem(sk));
    s.anomalies=[];
    s.anomalyNotifs=[];
    s.activeBoosts=[];
    s.pendingTechCredits=0;
    s.nextAnomalyAt=null;
    // Also remove anomaly-type fleets
    if(s.fleets&&Array.isArray(s.fleets)){
      var before=s.fleets.length;
      s.fleets=s.fleets.filter(function(f){return f&&f.kind!=="anomaly";});
      var removed=before-s.fleets.length;
      if(removed>0)console.log("Removed "+removed+" anomaly fleet(s)");
    }
    s.lastTick=Date.now();
    localStorage.setItem(sk,JSON.stringify(s));
    setStatus("✅ Anomalies désactivées. Recharge https://galaxia-4kz1.vercel.app","ok");
  }catch(e){setStatus("Erreur : "+e.message,"warn");}
}

function fixHard(){
  if(!confirm("Réparation agressive : vide anomalies, flottes, queue, notifs, boosts. Garde ressources, bâtiments, vaisseaux, missions. OK ?"))return;
  var sk=getStateKey();
  if(!sk){setStatus("Pas de state","warn");return;}
  try{
    var s=JSON.parse(localStorage.getItem(sk));
    s.fleets=[];
    s.anomalies=[];
    s.anomalyNotifs=[];
    s.activeBoosts=[];
    s.pendingTechCredits=0;
    s.queue=null;
    s.researchQueue=null;
    s.nextAnomalyAt=null;
    s.lastTick=Date.now();
    localStorage.setItem(sk,JSON.stringify(s));
    setStatus("✅ Réparation agressive appliquée","ok");
  }catch(e){setStatus("Erreur : "+e.message,"warn");}
}

function resetTick(){
  if(!confirm("Remettre lastTick à maintenant pour éviter un gros rattrapage. OK ?"))return;
  var keys=getKeys();
  var n=0;
  for(var i=0;i<keys.length;i++){
    if(keys[i].indexOf("gx_state_")!==0&&keys[i].indexOf("gx_colony_")!==0)continue;
    try{
      var s=JSON.parse(localStorage.getItem(keys[i]));
      if(s){s.lastTick=Date.now();localStorage.setItem(keys[i],JSON.stringify(s));n++;}
    }catch(e){}
  }
  setStatus("✅ "+n+" save(s) tick reset","ok");
}

function downloadSave(){
  var keys=getKeys();
  var save={};
  for(var i=0;i<keys.length;i++)save[keys[i]]=localStorage.getItem(keys[i]);
  var blob=new Blob([JSON.stringify(save,null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;a.download="galaxia-save-"+Date.now()+".json";a.click();
  URL.revokeObjectURL(url);
  setStatus("✅ Téléchargement lancé","ok");
}

function showStateOnly(){
  var sk=getStateKey();
  if(!sk){setStatus("Pas de state","warn");return;}
  try{
    var s=JSON.parse(localStorage.getItem(sk));
    // Show only key fields, not the giant zones/buildings arrays
    var summary={
      resources:s.resources,
      ships:s.ships,
      fleets:s.fleets,
      anomalies:s.anomalies,
      anomalyNotifs:s.anomalyNotifs,
      activeBoosts:s.activeBoosts,
      pendingTechCredits:s.pendingTechCredits,
      nextAnomalyAt:s.nextAnomalyAt,
      queue:s.queue,
      researchQueue:s.researchQueue,
      lastTick:s.lastTick,
      tech:s.tech,
      missionFlags:s.missionFlags,
      activeMission:s.activeMission,
      buildings:s.buildings
    };
    setOutput('<div class="box"><b>State principal :</b><pre>'+JSON.stringify(summary,null,2)+'</pre></div>');
  }catch(e){setStatus("Erreur : "+e.message,"warn");}
}

function resetAll(){
  if(!confirm("⚠️ Va EFFACER TOUTES tes données Galaxia. Sûr ?"))return;
  if(!confirm("Vraiment sûr ? IRRÉVERSIBLE."))return;
  var keys=getKeys();
  for(var i=0;i<keys.length;i++)localStorage.removeItem(keys[i]);
  setStatus("Tout effacé","warn");
}

window.addEventListener("load",function(){
  var keys=getKeys();
  if(keys.length===0)setStatus("⚠️ Aucune donnée Galaxia détectée","warn");
  else setStatus("✅ "+keys.length+" clé(s) détectée(s). Commence par 🔍 ANALYSER MA SAVE","ok");
});
</script>
</body>
</html>
